name: Validate Chinese Docs Build
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/validate-docs.yml'
      - 'docs/**'
      - 'scripts/qa-docs.mjs'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Audit Markdown links and fences (no deployment)
        run: npm run qa:docs
      - name: Build VitePress (no deployment)
        env:
          DOCS_BASE: /langfuse-zh-starter/
        run: npm run build
